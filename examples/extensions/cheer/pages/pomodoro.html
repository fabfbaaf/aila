<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>番茄钟</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101218; color: #d7dce5;
         font: 15px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  .box { text-align: center; }
  .time { font: 64px/1 Consolas, monospace; color: #a78bfa; letter-spacing: 2px; margin: 12px 0 20px; }
  button { margin: 0 6px; padding: 8px 18px; border: 1px solid #343a4c; border-radius: 8px; background: #1c212c;
           color: inherit; font: inherit; cursor: pointer; }
  button:hover { border-color: #a78bfa; }
  .hint { color: #8a92a3; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<div class="box">
  <div id="mode">专注</div>
  <div class="time" id="time">25:00</div>
  <button id="start">开始</button>
  <button id="reset">重来</button>
  <div class="hint">25 分钟专注，5 分钟休息。这个页面在沙盒里，不能联网，也碰不到艾拉的服务。</div>
</div>
<script>
  const FOCUS = 25 * 60, BREAK = 5 * 60
  let left = FOCUS, focus = true, timer = null
  const $ = (id) => document.getElementById(id)
  function show() {
    $('time').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0')
    $('mode').textContent = focus ? '专注' : '休息一下'
    document.title = $('time').textContent + ' · 番茄钟'
  }
  $('start').onclick = () => {
    if (timer) { clearInterval(timer); timer = null; $('start').textContent = '继续'; return }
    $('start').textContent = '暂停'
    timer = setInterval(() => {
      left -= 1
      if (left < 0) { focus = !focus; left = focus ? FOCUS : BREAK }
      show()
    }, 1000)
  }
  $('reset').onclick = () => { clearInterval(timer); timer = null; focus = true; left = FOCUS; $('start').textContent = '开始'; show() }
  show()
</script>
</body>
</html>
