# 本机开发：先用 scripts/create-db.sql 建库，再按需用环境变量覆盖
# 不想装数据库：./mvnw spring-boot:test-run 会启动一个内嵌的 PostgreSQL
server:
  port: ${AILA_SERVER_PORT:8790}
  # 放在 nginx 这类反向代理后面时设成 native，按 X-Forwarded-For 认客户端 IP（限流要用）；
  # 直接对外时保持 none，不然谁都能伪造这个头绕过限流
  forward-headers-strategy: ${AILA_FORWARD_HEADERS:none}

spring:
  application:
    name: aila-server
  datasource:
    url: ${AILA_DB_URL:jdbc:postgresql://127.0.0.1:5432/aila}
    username: ${AILA_DB_USER:aila}
    password: ${AILA_DB_PASSWORD:aila}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 表结构只由 Flyway 管，Hibernate 只检查对不对得上

aila:
  jwt:
    # 32 字节以上的 Base64。留空时每次启动随机生成（开发用：重启后访问令牌失效，客户端会用刷新令牌自动续上）
    secret: ${AILA_JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
  login:
    # 同一个邮箱连续输错这么多次后锁定一段时间
    max-failures: 5
    lock-duration: 15m
  # 同一个 IP 在一段时间内最多发这么多次注册、登录请求（防撞库、防批量注册）
  auth-limit:
    requests: 30
    window: 10m

management:
  endpoints:
    web:
      exposure:
        # metrics 里有接口路径、在线连接数这些运行信息，不对外；要接监控时再按需打开
        include: ${AILA_ACTUATOR_EXPOSE:health}
