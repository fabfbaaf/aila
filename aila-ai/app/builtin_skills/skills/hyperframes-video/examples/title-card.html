<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>本周技术速览</title>
  <style>
    html, body { margin: 0; }
    .card {
      position: relative;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 1280px;
      height: 720px;
      padding: 100px 120px;
      overflow: hidden;
      background: #102037;
      color: #f1f5f9;
      font: 28px system-ui, sans-serif;
    }
    h1 { margin: 0; font-size: 84px; line-height: 1.15; }
    p { margin: 30px 0 0; color: #bcebe1; }
  </style>
</head>
<body>
  <main id="main" class="card" data-composition-id="main" data-start="0"
        data-duration="3" data-width="1280" data-height="720" data-no-timeline>
    <h1>本周技术速览</h1>
    <p>从发布公告到原始论文</p>
  </main>
</body>
</html>
