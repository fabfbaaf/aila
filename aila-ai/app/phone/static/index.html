<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<title>艾拉</title>
<style>
:root {
  --bg: #0b0d16; --raised: #141827; --card: #1a1f31; --line: #262c44; --text: #e8eaf4; --muted: #8d93ad;
  --accent: #a78bfa; --cyan: #67e8f9; --ok: #4ade80; --warn: #facc15; --bad: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
body { display: flex; flex-direction: column; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #140f26; font-weight: 600; }
button:disabled { opacity: .5; }
input, textarea, select { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { resize: none; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line);
  padding-top: max(12px, env(safe-area-inset-top)); }
header .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
header .who { margin-left: auto; color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
nav button { flex: 1; border: none; background: transparent; color: var(--muted); }
nav button.on { background: var(--card); color: var(--text); }
main { flex: 1; overflow-y: auto; padding: 12px 16px; }
.hidden { display: none !important; }
.footer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line);
  padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--bg); }
.footer textarea { min-height: 44px; max-height: 140px; }
.footer button { flex: none; white-space: nowrap; }
.msg { max-width: 86%; margin: 8px 0; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user { margin-left: auto; background: #2a2350; border-bottom-right-radius: 4px; }
.msg.assistant { background: var(--card); border-bottom-left-radius: 4px; }
.status { color: var(--muted); font-size: 12px; margin: 4px 0; }
.ask { border: 1px solid var(--warn); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: rgba(250, 204, 21, .06); }
.ask .q { font-weight: 600; }
.ask pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin: 6px 0; max-height: 160px; overflow: auto; }
.ask .row { display: flex; gap: 8px; }
.err { color: var(--bad); font-size: 13px; margin: 6px 0; }
.task { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 10px 12px; }
.task .t { font-weight: 600; }
.task .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.run { background: var(--cyan); } .dot.wait { background: var(--warn); } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.line { font-size: 13px; margin: 4px 0; color: var(--muted); word-break: break-word; }
.line b { color: var(--text); font-weight: 500; }
.line .ok { color: var(--ok); } .line .bad { color: var(--bad); }
.line.wait { color: var(--warn); }
.bar { display: flex; gap: 8px; margin-bottom: 10px; }
.bar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; font-weight: 600; }
.pair { max-width: 360px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
.pair h1 { font-size: 22px; margin: 0; color: var(--accent); letter-spacing: 3px; }
.pair p { color: var(--muted); margin: 0; font-size: 13px; }
.code { font-size: 28px; letter-spacing: 10px; text-align: center; }
.form { display: flex; flex-direction: column; gap: 10px; }
.note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<section id="pair" class="pair hidden">
  <h1>艾拉</h1>
  <p>在电脑上打开 设置 → 手机，打开「允许手机连接」，点「配对一台手机」，把 6 位配对码填在这里。</p>
  <input id="pairCode" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="······">
  <input id="pairName" maxlength="40" placeholder="这台手机叫什么（比如：我的手机）">
  <button id="pairGo" class="primary">配对</button>
  <div id="pairErr" class="err"></div>
</section>

<div id="app" class="hidden" style="display:flex;flex-direction:column;height:100%">
  <header><span class="logo">艾拉</span><span id="who" class="who"></span></header>
  <nav><button id="tabChat" class="on">对话</button><button id="tabTasks">任务</button></nav>

  <main id="chat"></main>
  <div id="chatFooter" class="footer">
    <textarea id="chatInput" rows="1" placeholder="和她说点什么"></textarea>
    <button id="chatSend" class="primary">发送</button>
  </div>

  <main id="tasks" class="hidden">
    <div class="bar"><span class="grow">任务</span><button id="newTaskBtn">新任务</button><button id="refresh">刷新</button></div>
    <div id="newTask" class="form hidden">
      <select id="ntProject"></select>
      <textarea id="ntText" rows="4" placeholder="要她做什么"></textarea>
      <div class="note">手机上开的任务是「先问再改」：她要改文件、跑命令时，要你在电脑上点同意。</div>
      <button id="ntGo" class="primary">开始</button>
      <div id="ntErr" class="err"></div>
    </div>
    <div id="taskList"></div>
  </main>

  <main id="detail" class="hidden">
    <div class="bar"><button id="back">返回</button><span id="dTitle" class="grow"></span><button id="stop">停下</button></div>
    <div id="dEvents"></div>
  </main>
  <div id="detailFooter" class="footer hidden">
    <textarea id="dInput" rows="1" placeholder="接着跟她说"></textarea>
    <button id="dSend" class="primary">发送</button>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
